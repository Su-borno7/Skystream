name: Build Android (Skystream)

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Skystream APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No manual SDK step: GitHub's ubuntu-latest image ships the Android SDK
      # (same setup upstream CloudStream CI relies on).
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Load public keystore credentials
        working-directory: android
        run: |
          echo "SKYSTREAM_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/skystream-release.keystore" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEYSTORE_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_ALIAS=skystream" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble stable release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleStableRelease --stacktrace -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      # The sandbox this repo is developed in cannot read GitHub logs directly;
      # surface the Gradle failure summary as workflow annotations instead.
      - name: Annotate failures from log
        if: failure()
        run: |
          # Diagnostics: surface the real failure. 'Execution failed for task' never
          # matched last time (daemon crash / truncated log), so grep broad markers,
          # print the 'What went wrong' block with context, and dump log head/tail.
          LOG="$RUNNER_TEMP/android-build.log"
          emit() { printf '::error::%s\n' "$(printf '%s' "$1" | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-400)"; }
          if [ -f "$LOG" ]; then
            emit "==== log size: $(wc -l < "$LOG") lines ===="
            emit "==== markers ===="
            grep -n -E 'FAILURE:|What went wrong|FAILED|Execution failed|daemon.*(crash|disappear|died)|OutOfMemory|heap space|error:' "$LOG" | head -30 | while IFS= read -r line; do emit "$line"; done
            emit "==== What went wrong block ===="
            L=$(grep -n 'What went wrong' "$LOG" | head -1 | cut -d: -f1)
            if [ -n "$L" ]; then A=$((L > 8 ? L - 8 : 1)); sed -n "${A},$((L + 30))p" "$LOG" | while IFS= read -r line || [ -n "$line" ]; do emit "$line"; done; fi
            emit "==== head 15 ===="
            head -15 "$LOG" | while IFS= read -r line || [ -n "$line" ]; do emit "$line"; done
            emit "==== tail 50 ===="
            tail -50 "$LOG" | while IFS= read -r line || [ -n "$line" ]; do emit "$line"; done
          else
            emit "log file missing: $LOG"
          fi
          exit 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skystream-android-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
