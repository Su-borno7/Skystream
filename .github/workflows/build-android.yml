name: Build Android (Skystream)

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Skystream APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No manual SDK step: GitHub's ubuntu-latest image ships the Android SDK
      # (same setup upstream CloudStream CI relies on).
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Load public keystore credentials
        working-directory: android
        run: |
          echo "SKYSTREAM_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/skystream-release.keystore" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEYSTORE_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_ALIAS=skystream" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble stable release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleStableRelease --stacktrace -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      # The sandbox this repo is developed in cannot read GitHub logs directly;
      # surface the Gradle failure summary as workflow annotations instead.
      - name: Annotate failures from log
        if: failure()
        run: |
          # Diagnostics: dump the failure block to a step summary we can read via
          # the check-runs API (annotations are capped), plus a small annotation.
          LOG="$RUNNER_TEMP/android-build.log"
          emit() { printf '::error::%s\n' "$(printf '%s' "$1" | sed 's/%/%25/g' | tr '\n' ' ' | cut -c1-400)"; }
          SUMMARY="$GITHUB_STEP_SUMMARY"
          if [ -f "$LOG" ]; then
            echo '=== log size: '"$(wc -l < "$LOG")"' lines ===' >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            L=$(grep -n 'FAILURE:' "$LOG" | head -1 | cut -d: -f1)
            if [ -z "$L" ]; then L=$(wc -l < "$LOG"); fi
            A=$((L > 30 ? L - 30 : 1))
            sed -n "${A},$((L + 25))p" "$LOG" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo '=== grep: mergeStableReleaseResources ===' >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            grep -n 'mergeStableReleaseResources\|processStableReleaseResources\|stableRelease' "$LOG" | head -40 >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo '=== grep: Error/exception/aapt/Resource ===' >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            grep -n -i -E 'error|exception|aapt|resource|duplicate|failed' "$LOG" | head -60 >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            emit "see step summary for the full failure block ($(wc -l < "$LOG") log lines)"
          else
            emit "log file missing: $LOG"
          fi
          exit 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skystream-android-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
