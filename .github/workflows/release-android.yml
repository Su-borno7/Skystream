name: Release Android (Skystream)

# Tag-triggered APK packaging. Builds the signed stable APK (public keystore
# committed at android/keystore/) and publishes it to a GitHub release.
#
# Trigger:  git tag android-v1.0.0 && git push origin android-v1.0.0
# or run manually via workflow_dispatch (produces the APK as a workflow
# artifact only; releases are created from tags).

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # No manual SDK step: GitHub's ubuntu-latest image ships the Android SDK
      # (same setup upstream CloudStream CI relies on).
      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Load public keystore credentials
        working-directory: android
        run: |
          echo "SKYSTREAM_KEYSTORE=$GITHUB_WORKSPACE/android/keystore/skystream-release.keystore" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEYSTORE_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_PASSWORD=$(cat keystore/PASSWORD.txt)" >> "$GITHUB_ENV"
          echo "SKYSTREAM_KEY_ALIAS=skystream" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Assemble stable release APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleStableRelease --stacktrace -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      # The sandbox this repo is developed in cannot read GitHub logs directly;
      # surface the Gradle failure summary as workflow annotations instead.
      - name: Annotate failures from log
        if: failure()
        shell: bash
        run: |
          # Diagnostics in this file almost always sit right before the failing
          # task's exception block. Print ONLY that window (annotations are capped).
          LOG="$RUNNER_TEMP/android-build.log"
          if [ -f "$LOG" ]; then
            FIRST=$(grep -n 'Execution failed for task' "$LOG" | head -1 | cut -d: -f1)
            if [ -n "$FIRST" ]; then
              START=$((FIRST > 60 ? FIRST - 60 : 1))
              sed -n "${START},$((FIRST))p" "$LOG" | tail -45 | while IFS= read -r line || [ -n "$line" ]; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-2000)"
              done
            else
              tail -25 "$LOG" | while IFS= read -r line || [ -n "$line" ]; do
                printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-2000)"
              done
            fi
          fi
          exit 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: ${{ runner.temp }}/android-build.log
          if-no-files-found: ignore

      - name: Locate and rename APK
        id: apk
        shell: bash
        run: |
          SRC=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="dev"; fi
          DEST="$RUNNER_TEMP/Skystream-${VERSION}-android.apk"
          cp "$SRC" "$DEST"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skystream-android-apk
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
