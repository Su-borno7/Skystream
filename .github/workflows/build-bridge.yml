name: Build Bridge (Cinelab)

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'bridge/**'
      - '.github/workflows/build-bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/build-bridge.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build JVM bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # CloudStream's own library (the extension API) is built from source;
      # NiceHttp is compiled the same way (upstream depends on it).
      - name: Fetch upstream sources
        working-directory: bridge
        run: ./fetch-upstream.sh

      - name: Build bridge (installDist)
        working-directory: bridge
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:installDist --stacktrace -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee "$RUNNER_TEMP/bridge-build.log"

      # The sandbox this repo is developed in cannot read GitHub logs directly;
      # surface compiler diagnostics as workflow annotations instead.
      - name: Annotate failures from log
        if: failure()
        run: |
          # Print ONLY the "What went wrong" section plus any Kotlin diagnostics.
          # GitHub caps how many annotations a step can emit, so this must stay tiny.
          LOG="$RUNNER_TEMP/bridge-build.log"
          if [ ! -f "$LOG" ]; then echo "::error::log missing"; exit 0; fi
          {
            grep -E '^e: ' "$LOG" | cut -c1-450
          } | sed 's/%/%25/g' | cut -c1-1000 | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          exit 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-build-log
          path: ${{ runner.temp }}/bridge-build.log
          if-no-files-found: ignore

      - name: Smoke test bridge (health endpoint)
        run: |
          set -e
          cd bridge/app/build/install/cinelab-bridge
          mkdir -p /tmp/cinelab-bridge-smoke
          ./bin/cinelab-bridge /tmp/cinelab-bridge-smoke > /tmp/bridge-smoke.log 2>&1 &
          BRIDGE_PID=$!
          for i in $(seq 1 90); do
            if grep -q 'CINELAB_PORT=' /tmp/bridge-smoke.log 2>/dev/null; then break; fi
            if ! kill -0 "$BRIDGE_PID" 2>/dev/null; then echo "bridge died"; cat /tmp/bridge-smoke.log; exit 1; fi
            sleep 1
          done
          PORT=$(grep -oP 'CINELAB_PORT=\K[0-9]+' /tmp/bridge-smoke.log | head -1)
          if [ -z "$PORT" ]; then
            echo "bridge never reported CINELAB_PORT; smoke log follows:"
            tail -30 /tmp/bridge-smoke.log
            tail -25 /tmp/bridge-smoke.log | sed 's/%/%25/g' | cut -c1-500 | while IFS= read -r line; do printf '::error::smoke: %s\n' "$line"; done
            exit 1
          fi
          echo "bridge reported port $PORT"
          if ! curl -fsS "http://127.0.0.1:$PORT/health" | tee /tmp/bridge-health.json; then
            echo "health request failed; smoke log follows:"
            tail -30 /tmp/bridge-smoke.log
            tail -25 /tmp/bridge-smoke.log | sed 's/%/%25/g' | cut -c1-500 | while IFS= read -r line; do printf '::error::smoke: %s\n' "$line"; done
            exit 1
          fi
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/bridge-health.json || { echo "health not ok"; cat /tmp/bridge-health.json; tail -15 /tmp/bridge-smoke.log | while IFS= read -r line; do printf '::error::smoke: %s\n' "$line"; done; exit 1; }
          if ! curl -fsS "http://127.0.0.1:$PORT/providers" | tee /tmp/bridge-providers.json; then
            echo "providers request failed; smoke log follows:"
            tail -30 /tmp/bridge-smoke.log
            tail -25 /tmp/bridge-smoke.log | sed 's/%/%25/g' | cut -c1-500 | while IFS= read -r line; do printf '::error::smoke: %s\n' "$line"; done
            exit 1
          fi
          grep -q '"providers"' /tmp/bridge-providers.json || { echo "providers missing"; cat /tmp/bridge-providers.json; exit 1; }
          kill "$BRIDGE_PID" || true
          echo "bridge smoke test passed"

      - name: Annotate smoke log on failure
        if: failure()
        run: |
          if [ -f /tmp/bridge-smoke.log ]; then
            tail -25 /tmp/bridge-smoke.log | sed 's/%/%25/g' | cut -c1-500 | while IFS= read -r line; do printf '::error::smoke: %s\n' "$line"; done
          fi
          exit 0

      - name: Upload bridge distribution
        uses: actions/upload-artifact@v4
        with:
          name: cinelab-bridge-dist
          path: bridge/app/build/install/cinelab-bridge/
          if-no-files-found: error
