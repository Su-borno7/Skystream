name: Deploy website (GitHub Pages)

# Publishes website/ to https://su-borno7.github.io/Skystream/ on every push
# that touches the site. Pages must be configured with "Source: GitHub Actions"
# (Settings → Pages) — or enabled once via the API:
#   gh api repos/Su-borno7/Skystream/pages -X POST -f build_type=workflow

on:
  push:
    branches: ['arena/**', main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
