name: Release Desktop (Skystream)

# Tag-triggered desktop packaging. Builds the JVM bridge from upstream sources,
# bundles it into the Electron app via electron-builder, and publishes the
# installers (Linux AppImage, Windows NSIS) to a GitHub release.
#
# Trigger:  git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
# or run manually via the workflow_dispatch button (produces artifacts without a release).

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    # Produces installers as workflow artifacts only; releases are created from tags.

permissions:
  contents: write

jobs:
  bridge:
    name: Build JVM bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Fetch upstream sources
        working-directory: bridge
        run: |
          chmod +x fetch-upstream.sh
          ./fetch-upstream.sh

      - name: Build bridge (installDist)
        working-directory: bridge
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:installDist --stacktrace 2>&1 | tee "$RUNNER_TEMP/bridge-build.log"

      - name: Annotate failures from log
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/bridge-build.log"
          if [ -f "$LOG" ]; then
            grep -E '^e: |error:' "$LOG" | head -40 | while IFS= read -r line || [ -n "$line" ]; do
              printf '::error::%s\n' "$(printf '%s' "$line" | tr '\r' ' ' | sed 's/%/%25/g' | cut -c1-2000)"
            done
            sed -n '/What went wrong/,+8p' "$LOG" | while IFS= read -r line || [ -n "$line" ]; do
              printf '::error::%s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-2000)"
            done
          fi
          exit 0

      - name: Upload bridge distribution
        uses: actions/upload-artifact@v4
        with:
          name: skystream-bridge-dist
          path: bridge/app/build/install/skystream-bridge/
          if-no-files-found: error

  package:
    name: Package ${{ matrix.name }}
    needs: bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            builderArgs: '--linux AppImage --x64'
            artifactGlob: desktop/dist/*.AppImage
          - name: windows
            os: windows-latest
            builderArgs: '--win nsis --x64'
            artifactGlob: desktop/dist/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download bridge distribution
        uses: actions/download-artifact@v4
        with:
          name: skystream-bridge-dist
          path: bridge/app/build/install/skystream-bridge

      - name: Bundle Temurin JRE 21
        shell: bash
        run: |
          set -o pipefail
          OS="linux"
          if [ "${{ matrix.name }}" = "windows" ]; then OS="windows"; fi
          mkdir -p desktop/build/jre
          URL="https://api.adoptium.net/v3/binary/latest/21/ga/${OS}/x64/jre/hotspot/normal/eclipse"
          echo "Downloading Temurin 21 JRE for $OS/x64 from $URL"
          HTTP=$(curl -fSL --retry 3 --retry-delay 5 -w "%{http_code}" "$URL" -o "$PWD/jre-archive.tar.bin" 2>"$RUNNER_TEMP/jre-curl.err") || {
            echo "::error::JRE download failed (curl exit $?, http $HTTP): $(cat "$RUNNER_TEMP/jre-curl.err" | tail -3)"
            exit 1
          }
          echo "downloaded: http=$HTTP size=$(wc -c < "$PWD/jre-archive.tar.bin") bytes"
          head -c 100 "$PWD/jre-archive.tar.bin" | od -c | head -3
          if [ "$OS" = "windows" ]; then
            # Git Bash ships GNU tar, which cannot read .zip; use Windows' bsdtar instead.
            UNTAR="/c/Windows/System32/tar.exe"
          else
            UNTAR="tar"
          fi
          if ! "$UNTAR" -xf "$PWD/jre-archive.tar.bin" -C desktop/build/jre --strip-components=1 2>"$RUNNER_TEMP/jre-tar.err"; then
            echo "::error::JRE extraction failed (size=$(wc -c < "$PWD/jre-archive.tar.bin" 2>/dev/null), http=$HTTP): $(tail -3 "$RUNNER_TEMP/jre-tar.err")"
            head -c 200 "$PWD/jre-archive.tar.bin" 2>/dev/null | od -c | head -4 | while IFS= read -r l; do printf '::error::head: %s\n' "$(printf '%s' "$l" | sed 's/%/%25/g' | cut -c1-300)"; done
            exit 1
          fi
          rm -f "$PWD/jre-archive.tar.bin"
          if [ "$OS" = "windows" ]; then JAVA_BIN="desktop/build/jre/bin/java.exe"; else JAVA_BIN="desktop/build/jre/bin/java"; fi
          if ! "$JAVA_BIN" -version 2>"$RUNNER_TEMP/jre-java.err"; then
            echo "::error::bundled java failed to run: $(cat "$RUNNER_TEMP/jre-java.err" | tail -5); tree:"
            find desktop/build/jre -maxdepth 2 | head -20 | while IFS= read -r l; do printf '::error::tree: %s\n' "$l"; done
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Run renderer smoke tests
        working-directory: desktop
        run: npm test

      - name: Install libfuse2 (AppImage runtime dependency)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2 || echo "libfuse2 unavailable; continuing"

      - name: Package (electron-builder)
        working-directory: desktop
        run: |
          set -o pipefail
          npx electron-builder ${{ matrix.builderArgs }} --publish never 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      - name: Annotate packaging failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/electron-builder.log" ]; then
            grep -n -iE 'error|⨯|failed' "$RUNNER_TEMP/electron-builder.log" | tail -12 | while IFS= read -r line || [ -n "$line" ]; do
              printf '::error::pkg: %s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-1500)"
            done
            tail -18 "$RUNNER_TEMP/electron-builder.log" | while IFS= read -r line || [ -n "$line" ]; do
              printf '::error::tail: %s\n' "$(printf '%s' "$line" | sed 's/%/%25/g' | cut -c1-1500)"
            done
          fi
          exit 0

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: skystream-desktop-${{ matrix.name }}
          path: ${{ matrix.artifactGlob }}
          if-no-files-found: error

      - name: Publish to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifactGlob }}
          fail_on_unmatched_files: true
